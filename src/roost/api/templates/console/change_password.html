{% extends "base.html" %}
{% block main %}
<form class="card" method="post" action="/console/change-password">
  <h2>{{ t('change_password_title') }}</h2>
  <p>{{ t('change_password_help') }}</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if error %}
  <p class="error" role="alert">{{ t(error) }}</p>
  {% endif %}
  <label for="current_password">{{ t('current_password') }}</label>
  <input id="current_password" name="current_password" type="password" maxlength="128" required autocomplete="current-password">
  <label for="new_password">{{ t('new_password') }}</label>
  <input id="new_password" name="new_password" type="password" minlength="12" maxlength="128" required autocomplete="new-password">
  <label for="repeat_password">{{ t('repeat_password') }}</label>
  <input id="repeat_password" name="repeat_password" type="password" minlength="12" maxlength="128" required autocomplete="new-password">
  <button type="submit">{{ t('save_password') }}</button>
</form>
{% endblock %}
