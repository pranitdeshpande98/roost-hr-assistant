# Input guardrail configuration: reviewed like config/messages.yaml.
#
# keywords: regular expressions (case-insensitive) for wording that must never be
#   missed: emergencies and attempts to change the assistant's rules. A match decides
#   before any model is asked.
# examples and thresholds: the FALLBACK used only when the LLM classifier is
#   unavailable. A message is compared with every example (bge-m3 similarity); "none"
#   examples are look-alikes that must NOT be routed. Thresholds are the minimum
#   similarity to route, set low on purpose (dev split: 93% recall, 25% of allowed
#   messages over-routed): during an outage, over-routing is the safe direction.
#
# Never copy messages from evals/datasets/guardrails_v1.yaml here: the eval would
# then measure memory, not generalisation. A test enforces this.

thresholds:
  emergency: 0.55
  sensitive: 0.55
  injection: 0.55
  own_data: 0.55

keywords:
  self_harm:
    en:
      - '\bkill(ing)? myself\b'
      - '\bend(ing)? my (own )?life\b'
      - '\bsuicid'
      - '\b(do not|don''?t) want to (live|be alive)\b'
      - '\b(hurt|harm)(ing)? myself\b'
      - '\bcutting myself\b'
      - '\bbetter off without me\b'
    es:
      - '\bmatarme\b'
      - '\bme quiero matar\b'
      - '\bquitarme la vida\b'
      - '\bsuicid'
      - '\bno quiero (seguir )?vivi'
      - '\bhacerme daño\b'
      - '\bmejor sin mí\b'
    vi:
      - 'tự tử'
      - 'tự sát'
      - 'không muốn sống'
      - 'làm hại bản thân'
      - 'tự làm hại'
      - 'tự rạch'
  danger:
    en:
      - '\bon fire\b'
      - '\bthere''?s a fire\b'
      - '\ba fire (in|at|on)\b'
      - '\bnot breathing\b'
      - '\bunconscious\b'
      - '\b(gas|ammonia|chemical) (leak|spill)\b'
      - '\bbleeding (a lot|badly|heavily)\b'
      - '\b(has|with|bring(ing)?|brought) a (gun|knife|weapon)\b'
      - '\bactive shooter\b'
      - '\bsmell(s|ing)? (of )?(gas|ammonia|chemicals?)\b'
    es:
      - '\bhay un incendio\b'
      - '\bincendio en\b'
      - '\bse está quemando\b'
      - '\bno respira\b'
      - '\binconsciente\b'
      - '\bfuga de (gas|amoníaco)\b'
      - '\bsangra mucho\b'
      - '\b(un|una) (arma|pistola)\b'
      - '\bhuele (mucho )?a (gas|amoníaco|químicos?)\b'
      - '\bolor a (gas|amoníaco)\b'
    vi:
      - 'đang (có )?cháy'
      - 'bị cháy'
      - 'không thở'
      - 'bất tỉnh'
      - 'rò rỉ (khí|ga|amoniac)'
      - 'chảy máu (rất )?nhiều'
      - 'máu chảy (rất )?nhiều'
      - 'súng'
      - 'mùi (khí )?(ga|gas|amoniac|hóa chất)'
  injection:
    en:
      - '\b(ignore|disregard|forget)\b.{0,30}\b(instructions|rules|prompt)\b'
      - '\bsystem prompt\b'
      - '\bdeveloper mode\b'
      - '\b(reveal|print|show|repeat)\b.{0,40}\b(instructions|prompt|text above)\b'
      - '\bno restrictions\b'
      - '\byou are (now )?dan\b'
      - '^\s*system\s*:'
      - '\bjailbreak'
      - '\bemployee (#|no\.? ?|number )?\d{3,}'
      - '\bapprove\b.{0,30}\byourself\b'
    es:
      - '\b(ignora|olvida)\b.{0,30}\b(instrucciones|reglas)\b'
      - '\bprompt del sistema\b'
      - '\bmodo desarrollador\b'
      - '\b(revela|imprime|muestra|repite)\b.{0,40}\b(instrucciones|texto de arriba)\b'
      - '\bsin restricciones\b'
      - '^\s*sistema\s*:'
      - '\bempleado (#|n[úu]m(ero)?\.? ?)?\d{3,}'
      - '\baprueb\w*\b.{0,30}\btú mism[oa]\b'
    vi:
      - 'bỏ qua.{0,30}(hướng dẫn|quy tắc|quy định|chỉ dẫn)'
      - 'quên.{0,20}(hướng dẫn|chỉ dẫn|quy tắc)'
      - 'lời nhắc hệ thống'
      - 'chế độ nhà phát triển'
      - '(tiết lộ|in ra|lặp lại).{0,40}(hướng dẫn|chỉ dẫn|đoạn văn ở trên)'
      - 'không có giới hạn'
      - '^\s*hệ thống\s*:'
      - 'nhân viên (số )?\d{3,}'
      - 'tự duyệt'

examples:
  danger:
    - en: 'The building is on fire'
      es: 'El edificio se está quemando'
      vi: 'Tòa nhà đang bị cháy'
    - en: 'There''s a gas leak and people feel dizzy'
