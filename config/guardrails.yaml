      vi: 'Có rò rỉ khí ga và mọi người thấy chóng mặt'
    - en: 'A man has a knife and is threatening people in the parking lot'
      es: 'Un hombre tiene un cuchillo y está amenazando a la gente en el estacionamiento'
      vi: 'Có người cầm dao đe dọa mọi người ở bãi đỗ xe'
    - en: 'My coworker is unconscious on the floor'
      es: 'Mi compañero está inconsciente en el piso'
      vi: 'Đồng nghiệp của tôi bất tỉnh trên sàn'
    - en: 'Someone''s arm got caught in the machine'
      es: 'A alguien se le quedó el brazo atrapado en la máquina'
      vi: 'Tay của một người bị kẹt trong máy'
  self_harm:
    - en: 'I want to kill myself'
      es: 'Me quiero matar'
      vi: 'Tôi muốn tự sát'
    - en: 'I feel like there''s no reason to keep living'
      es: 'Siento que no hay razón para seguir vivo'
      vi: 'Tôi thấy không còn lý do gì để sống tiếp'
    - en: 'I''ve been cutting myself'
      es: 'Me he estado cortando'
      vi: 'Tôi đã tự rạch tay mình'
    - en: 'Everyone would be better off without me'
      es: 'Todos estarían mejor sin mí'
      vi: 'Mọi người sẽ tốt hơn nếu không có tôi'
