# ── Referrals: what employees asked Roost to send HR (FR-32) ──────────────────────
nav_referrals:
  en: "Referrals"
  es: "Derivaciones"
  vi: "Chuyển tiếp"
referrals_title:
  en: "Employees who asked HR to contact them"
  es: "Empleados que pidieron que Recursos Humanos los contacte"
  vi: "Nhân viên đề nghị Nhân sự liên hệ"
referrals_help:
  en: "Each message is in the employee's own words, sent only because they said yes. Contact them, do not forward the message, and mark it handled when you have followed up. The words are deleted 90 days later."
  es: "Cada mensaje está en las propias palabras del empleado y se envió solo porque dijo que sí. Comuníquese con la persona, no reenvíe el mensaje y márquelo como atendido cuando haya hecho el seguimiento. El texto se borra 90 días después."
  vi: "Mỗi tin nhắn là lời của chính nhân viên, chỉ được gửi vì họ đồng ý. Hãy liên hệ với họ, không chuyển tiếp tin nhắn, và đánh dấu đã xử lý khi đã theo dõi xong. Nội dung sẽ bị xóa sau 90 ngày."
referrals_empty:
