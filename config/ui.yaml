console_help:
  en: "For supervisors and HR. Sign in with your employee number and console password."
  es: "Para supervisores y Recursos Humanos. Inicie sesión con su número de empleado y su contraseña de la consola."
  vi: "Dành cho người giám sát và Nhân sự. Đăng nhập bằng mã số nhân viên và mật khẩu bảng điều khiển."
password:
