  es: "Elija su propia contraseña"
  vi: "Chọn mật khẩu của riêng bạn"
change_password_help:
  en: "At least 12 characters. A few unrelated words make a good one. Do not use your name or employee number."
  es: "Al menos 12 caracteres. Unas cuantas palabras sin relación entre sí funcionan bien. No use su nombre ni su número de empleado."
  vi: "Ít nhất 12 ký tự. Vài từ không liên quan đến nhau là một lựa chọn tốt. Không dùng tên hoặc mã số nhân viên của bạn."
