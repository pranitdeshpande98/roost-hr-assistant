  es: "Las dos contraseñas nuevas no son iguales."
  vi: "Hai mật khẩu mới không giống nhau."
wrong_current_password:
  en: "The current password is not right."
  es: "La contraseña actual no es correcta."
  vi: "Mật khẩu hiện tại không đúng."
password_too_short:
  en: "Use at least 12 characters."
  es: "Use al menos 12 caracteres."
  vi: "Hãy dùng ít nhất 12 ký tự."
password_too_long:
  en: "Use at most 128 characters."
  es: "Use como máximo 128 caracteres."
  vi: "Hãy dùng tối đa 128 ký tự."
password_too_simple:
  en: "Use more different characters."
  es: "Use más caracteres distintos."
  vi: "Hãy dùng nhiều ký tự khác nhau hơn."
password_common:
  en: "That password is too well known. Choose another."
  es: "Esa contraseña es demasiado conocida. Elija otra."
  vi: "Mật khẩu đó quá phổ biến. Hãy chọn mật khẩu khác."
password_personal:
  en: "Do not use your name or employee number."
  es: "No use su nombre ni su número de empleado."
  vi: "Không dùng tên hoặc mã số nhân viên của bạn."
