  es: "Algo salió mal. Intente de nuevo o consulte a la oficina de Recursos Humanos de su planta."
  vi: "Đã xảy ra lỗi. Vui lòng thử lại hoặc hỏi văn phòng Nhân sự của nhà máy."
notices:
  en: "Updates for you"
  es: "Novedades para usted"
  vi: "Thông báo cho bạn"

