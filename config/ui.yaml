  es: "NO"
  vi: "KHÔNG"
working:
  en: "Working on it…"
  es: "Un momento…"
  vi: "Đang xử lý…"
you:
  en: "You"
  es: "Usted"
  vi: "Bạn"
roost:
  en: "Roost"
  es: "Roost"
  vi: "Roost"
sign_out:
  en: "Sign out"
  es: "Cerrar sesión"
  vi: "Đăng xuất"
privacy_notice:
  en: "For your privacy, you are signed out after 2 minutes without activity."
  es: "Por su privacidad, la sesión se cierra tras 2 minutos sin actividad."
  vi: "Để bảo vệ quyền riêng tư, bạn sẽ bị đăng xuất sau 2 phút không hoạt động."
