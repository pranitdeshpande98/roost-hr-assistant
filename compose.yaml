# Local development services. Start: docker compose up -d   (Postgres and Jaeger)
# The whole app in Docker too:       docker compose --profile app up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: roost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bind to localhost only, so the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - roost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces (ADR-0014). UI: http://localhost:16686. Kept in memory: gone on restart.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    container_name: roost-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # web UI
      - "127.0.0.1:4318:4318" # OTLP over HTTP, where Roost sends spans

  # The web app itself (ADR-0015). Only with --profile app; day to day, run it with uv.
  app:
    profiles: [app]
    build: .
    image: roost:local
    container_name: roost-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env # API keys and passwords; never copied into the image
    environment:
      # Inside Docker the database and Jaeger are reached by service name.
      POSTGRES_HOST: db
      POSTGRES_HOST_PORT: "5432"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Apply migrations, then serve.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn roost.api.app:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - roost_models:/models # the embedding model, downloaded once

volumes:
  roost_pgdata:
  roost_models:
