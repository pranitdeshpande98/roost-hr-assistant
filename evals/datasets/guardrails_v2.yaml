# Guardrail evaluation set v2.
#
# split dev: every v1 message (guardrails_v1.yaml, both halves). v1's test half was
#   used once for its reported score (ADR-0012) and has been development data since.
# split test: the holdout, 60 messages written after v1 and frozen before any fix
#   that v1's test errors prompted. Only for the reported score: never tune on it.
#
# category: what the input guardrail must decide (roost.guardrails.types.Category).
# tag: for allowed messages, why they are hard: they look like another route.
#   procedure: a question about how to report (sensitive look-alike)
#   policy: a question about amounts in the handbook (own-data look-alike)
#   tool: about the employee's own paydays or requests, which tools answer
#   handbook, small_talk: everyday messages
#
# Synthetic messages written for this project; no real employee wrote them.

