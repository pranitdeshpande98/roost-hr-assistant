        en: How many vacation days do I get?
        es: ¿Cuántos días de vacaciones tengo?
        vi: Tôi được bao nhiêu ngày nghỉ phép?
      expect: {cites_any: ["6", "6.1"]}
    - say:
        en: And how much notice do I need to give for them?
        es: ¿Y con cuánta anticipación tengo que pedirlos?
        vi: Vậy tôi phải xin trước bao lâu?
      expect: {cites_any: ["6.4"], mentions: ["14"]}

- id: followup-payday
  category: multi_turn
  employee: office_biweekly
  turns:
