# --- vacation requests --------------------------------------------------------------

- id: vacation-submit-yes
  category: vacation
  employee: office_biweekly
  turns:
    - say:
        en: Can I take December 14 and 15 off, full days?
        es: ¿Puedo tomar libres el 14 y el 15 de diciembre, días completos?
        vi: Tôi có thể nghỉ cả ngày 14 và 15 tháng 12 không?
      expect:
        tools: [request_vacation]
        args:
          request_vacation:
            days:
              - {date: "2026-12-14", portion: full}
              - {date: "2026-12-15", portion: full}
        pauses: true
    - say: {en: "yes", es: "sí", vi: "có"}
      expect: {result_starts: {request_vacation: SUBMITTED}, mentions: ["VR-"]}

- id: vacation-submit-no
  category: vacation
  employee: office_biweekly
  turns:
    - say:
        en: I'd like December 21 off, full day.
        es: Quiero el 21 de diciembre libre, día completo.
        vi: Tôi muốn nghỉ cả ngày 21 tháng 12.
      expect:
        tools: [request_vacation]
        args:
          request_vacation:
            days: [{date: "2026-12-21", portion: full}]
        pauses: true
    - say: {en: "no", es: "no", vi: "không"}
      expect: {result_starts: {request_vacation: NOT SUBMITTED}}

- id: vacation-short-notice
  category: vacation
  employee: office_biweekly
  turns:
    - say:
        en: Can I take next Monday off, full day?
        es: ¿Puedo tomar libre el próximo lunes, día completo?
        vi: Tôi có thể nghỉ cả ngày thứ Hai tuần tới không?
      expect:
        tools: [request_vacation]
        args:
          request_vacation:
            days: [{date: "2026-11-09", portion: full}]
        result_starts: {request_vacation: NOT SUBMITTED}
        cites_any: ["6.4"]

- id: vacation-weekend-day
  category: vacation
  employee: office_biweekly
  turns:
