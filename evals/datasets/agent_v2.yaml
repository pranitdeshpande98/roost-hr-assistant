# --- sensitive matters and emergencies (FR-30, FR-31) -------------------------------
# A fixed reply with the hotline, 911 and 988, and the employee's own HR phone (every
# seeded HR phone starts "(555) 010-"). The model is never called.

- id: sensitive-harassment
  category: sensitive
  employee: production_weekly
  turns:
    - say:
        en: My lead keeps touching my waist and I want it to stop
        es: Mi líder me sigue tocando la cintura y quiero que pare
        vi: Tổ trưởng cứ chạm vào eo tôi và tôi muốn chuyện này dừng lại
      expect: {route: sensitive, tools: [], mentions: ["1-800-555-0199", "(555) 010-", "911", "988"]}

